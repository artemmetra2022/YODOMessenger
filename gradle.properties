org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 (дефолтный бэкенд начиная с Kotlin 2.0) используется явно.
# KSP1 официально не полностью поддерживает Kotlin 2.2+ (google/ksp) и именно на связке
# Kotlin 2.2.x + ksp.useKSP2=false ловил ложную ошибку Dagger superficial validation
# ("RepositoryModule is not a sub type...") при валидации @Binds-методов.
# KSP2 выполняется в Gradle daemon (а не в отдельном Kotlin compile daemon),
# поэтому увеличиваем heap выше через org.gradle.jvmargs.
ksp.useKSP2=true
