<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена | YODO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body {
      height: 100%;
      overflow: auto;
    }

    .nf-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
      position: relative;
    }

    /* Мягкий акцентный ореол по центру фона */
    .nf-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%);
      pointer-events: none;
    }

    .nf-card {
      position: relative;
      width: min(440px, 100%);
      background: var(--bg-panel);
      border-radius: 20px;
      padding: 44px 32px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    html.theme-light .nf-card {
      box-shadow: 0 20px 60px rgba(20, 30, 45, 0.10);
      border: 1px solid #e5e9ee;
    }

    /* Плавающий значок-призрак */
    .nf-ghost-wrap {
      width: 108px;
      height: 108px;
      margin-bottom: 8px;
      animation: nf-float 3.2s ease-in-out infinite;
    }

    @keyframes nf-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .nf-ghost-wrap svg { width: 100%; height: 100%; display: block; }

    .nf-code {
      font-size: 76px;
      font-weight: 800;
      letter-spacing: 4px;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-top: 4px;
    }

    .nf-title {
      font-size: 19px;
      font-weight: 700;
      margin-top: 14px;
      color: var(--text);
    }

    .nf-subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 8px;
      line-height: 1.5;
      max-width: 340px;
    }

    .nf-actions {
      display: flex;
      gap: 10px;
      margin-top: 28px;
      width: 100%;
    }

    .nf-actions .btn-primary,
    .nf-actions .btn-secondary {
      flex: 1;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nf-brand {
      margin-top: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--text-dim);
      font-size: 12px;
      opacity: 0.7;
    }

    .nf-brand span { color: var(--accent); }

    @media (max-width: 420px) {
      .nf-code { font-size: 60px; }
      .nf-card { padding: 36px 22px 28px; }
    }
  </style>
</head>
<body>
  <div class="nf-screen">
    <div class="nf-card">
      <div class="nf-ghost-wrap">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ghostGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent)"/>
              <stop offset="100%" stop-color="var(--accent-dark)"/>
            </linearGradient>
          </defs>
          <path d="M60 14c-22 0-38 16.5-38 39v37.5c0 2.6 3 4 4.9 2.2l7.4-6.9 8.6 8c1.6 1.5 4.1 1.5 5.7 0l8.4-7.8 8.4 7.8c1.6 1.5 4.1 1.5 5.7 0l8.6-8 7.4 6.9c1.9 1.8 4.9 0.4 4.9-2.2V53c0-22.5-16-39-38-39z" fill="url(#ghostGrad)"/>
          <circle cx="46" cy="52" r="6.5" fill="var(--bg-panel)"/>
          <circle cx="74" cy="52" r="6.5" fill="var(--bg-panel)"/>
          <path d="M44 72c4.5 5 10 5 16 0" stroke="var(--bg-panel)" stroke-width="4" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <div class="nf-code">404</div>
      <div class="nf-title">Здесь ничего нет</div>
      <p class="nf-subtitle">Эта страница не найдена, была перемещена или никогда не существовала. Возможно, ссылка устарела — проверьте адрес или вернитесь в мессенджер.</p>

      <div class="nf-actions">
        <a href="index.html" class="btn-primary">На главную</a>
        <button type="button" class="btn-secondary" onclick="history.back()">Назад</button>
      </div>

      <div class="nf-brand">YODO<span>MESSENGER</span></div>
    </div>
  </div>

  <script>
    // Подхватываем сохранённую тему, как на остальном сайте.
    (function () {
      try {
        var saved = localStorage.getItem("yodo-theme");
        if (saved === "light") document.documentElement.classList.add("theme-light");
      } catch (e) { /* приватный режим и т.п. */ }
    })();
  </script>
</body>
</html>
