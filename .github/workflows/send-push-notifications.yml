name: Send Push Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  send-push:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: yodo-send-push
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"

      - name: Process notifications and scheduled news campaigns
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        working-directory: .github/scripts
        run: node send-push-notifications.js

      - name: Remove service account
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
