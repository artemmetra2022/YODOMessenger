name: Build Release APK

on:
  workflow_dispatch:        # запуск вручную кнопкой "Run workflow" на вкладке Actions
  push:
    branches: [ main ]

# Прикрепление APK к релизу требует права записи в содержимое репозитория.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # В проекте нет закоммиченного gradlew/gradle-wrapper.jar (бинарный файл),
      # поэтому используем официальный action, который сам скачивает и запускает Gradle.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # Отключаем сохранение/восстановление Gradle build cache между запусками CI.
          # KSP/Hilt инкрементальная компиляция иногда ломается при восстановлении
          # устаревшего кэша между ревизиями (ложная ошибка Dagger superficial validation
          # вида "X is not a sub type of the class/interface that contains ..."),
          # поэтому каждая сборка на CI должна быть полностью чистой.
          cache-disabled: true

      # google-services.json нельзя хранить в открытом репозитории (там ключи Firebase-проекта).
      # Секрет может быть либо base64-строкой, либо вставленным как есть JSON — обрабатываем оба случая.
      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON пустой или не задан. Добавь его в Settings → Secrets and variables → Actions."
            exit 1
          fi

          TRIMMED=$(echo "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          if [[ "$TRIMMED" == "{"* ]]; then
            # Секрет — это сырой JSON, а не base64
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            # Секрет — это base64-строка
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi

          echo "--- Проверка валидности JSON ---"
          python3 -c "import json; json.load(open('app/google-services.json'))" && echo "OK: google-services.json валиден"

      # Постоянный ключ подписи обязателен для OTA: без него каждая сборка получает
      # новую подпись, и установка обновления поверх установленного приложения
      # отклоняется системой (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # Ключ лежит в секрете (base64), в репозиторий не попадает.
      - name: Restore release keystore from secret
        env:
          YODO_KEYSTORE_BASE64: ${{ secrets.YODO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$YODO_KEYSTORE_BASE64" ]; then
            echo "::error::Secret YODO_KEYSTORE_BASE64 не задан — release APK нельзя подписать постоянным ключом."
            exit 1
          fi
          echo "$YODO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yodo-release.jks"
          echo "Keystore восстановлен: $RUNNER_TEMP/yodo-release.jks"

      # Версия берётся из последнего GitHub-релиза (тег вида v1.2.3 → versionName=1.2.3,
      # versionCode=10203). Если релиза нет или тег не в формате vX.Y.Z — fallback на дефолт.
      - name: Get latest release version
        id: release
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request

          tag = ""
          release_date = ""
          try:
              with urllib.request.urlopen(
                  "https://api.github.com/repos/artemmetra2022/YODOMessenger/releases/latest",
                  timeout=15,
              ) as resp:
                  release = json.load(resp)
                  tag = release.get("tag_name", "")
                  release_date = (release.get("published_at") or "")[:10]
          except Exception:
              pass

          m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag or "")
          if m:
              major, minor, patch = map(int, m.groups())
              version_name = f"{major}.{minor}.{patch}"
              version_code = major * 10000 + minor * 100 + patch
          else:
              version_name = "0.1.0-mvp"
              version_code = 1
              release_date = ""
          print(f"Latest release tag: {tag!r} -> versionName={version_name}, versionCode={version_code}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag={tag}\n")
              f.write(f"version_name={version_name}\n")
              f.write(f"version_code={version_code}\n")
              f.write(f"release_date={release_date}\n")
          EOF

      # Offline About history ships inside the APK. Keep the bundled copy if GitHub is unavailable.
      - name: Refresh short release history
        run: python3 tools/update-release-history.py || echo "Using bundled release history"

      - name: Build release APK
        env:
          YODO_KEYSTORE_PATH: ${{ runner.temp }}/yodo-release.jks
          YODO_KEYSTORE_PASSWORD: ${{ secrets.YODO_KEYSTORE_PASSWORD }}
          YODO_KEY_ALIAS: ${{ secrets.YODO_KEY_ALIAS }}
          YODO_KEY_PASSWORD: ${{ secrets.YODO_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionName=${{ steps.release.outputs.version_name }} -PversionCode=${{ steps.release.outputs.version_code }} -PreleaseDate=${{ steps.release.outputs.release_date }} --stacktrace

      - name: Prepare APK for release
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::Release APK не найден: $SRC"
            exit 1
          fi
          NAME="YODO-Messenger-${{ steps.release.outputs.version_name }}.apk"
          cp "$SRC" "./$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "./$NAME"

      # Отпечатки подписи нужны для Google Sign-In и Phone Auth: при смене ключа
      # подписи новый SHA-1 обязательно нужно добавить в Firebase Console.
      # Берём напрямую из собранного APK через apksigner.
      - name: Print APK signing SHA-1 / SHA-256
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "SHA-1|SHA-256"

      # Прикрепляем подписанный APK к последнему релизу — именно этот файл
      # приложение скачивает и устанавливает при OTA-обновлении (см. UpdateRepositoryImpl:
      # берётся первый asset релиза с расширением .apk).
      - name: Attach APK to GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            "${{ steps.apk.outputs.name }}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yodo-messenger-release-apk
          path: ${{ steps.apk.outputs.name }}
